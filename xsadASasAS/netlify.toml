# Настройки публикации на Netlify. Здесь НЕТ секретов.
# Сайт — обычные файлы без сборки, публикуем корень проекта.
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
