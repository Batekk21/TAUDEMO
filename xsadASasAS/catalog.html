<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — ТАУ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <div id="site-header"></div>
  <main id="main" class="section">
    <div class="section-head"><h2>Каталог</h2></div>
    <div class="catalog">
      <form class="filters" id="filters" aria-label="Фильтры" onsubmit="return false">
        <fieldset><legend>Категория</legend><div class="checks" id="f-cat"></div></fieldset>
        <fieldset><legend>Цена, ₸</legend>
          <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div class="field"><label for="pmin" class="sr-only">Цена от</label><input id="pmin" type="number" min="0" step="500" inputmode="numeric" placeholder="от"></div>
            <div class="field"><label for="pmax" class="sr-only">Цена до</label><input id="pmax" type="number" min="0" step="500" inputmode="numeric" placeholder="до"></div>
          </div>
        </fieldset>
        <fieldset><legend>Размер</legend><div class="checks" id="f-size"></div></fieldset>
        <fieldset><legend>Цвет</legend><div class="checks" id="f-color"></div></fieldset>
        <fieldset><legend>Наличие</legend>
          <div class="checks"><label><input type="checkbox" id="f-stock"> Только в наличии</label>
          <label><input type="checkbox" id="f-new"> Только новинки</label></div>
        </fieldset>
        <button type="button" class="btn ghost small" id="reset-filters">Сбросить фильтры</button>
      </form>

      <div>
        <button type="button" class="btn ghost small filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">Фильтры</button>
        <div class="toolbar">
          <div class="field"><label for="q">Поиск</label><input id="q" type="search" placeholder="Например, худи" autocomplete="off"></div>
          <div class="field"><label for="sort">Сортировка</label>
            <select id="sort">
              <option value="default">По умолчанию</option>
              <option value="price-asc">Сначала дешёвые</option>
              <option value="price-desc">Сначала дорогие</option>
              <option value="name">По названию</option>
            </select>
          </div>
        </div>
        <p class="result-count" id="count" aria-live="polite"></p>
        <div id="grid" class="grid" aria-live="polite"><p class="loading">Загрузка…</p></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
