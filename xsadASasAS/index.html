<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ТАУ — демо-магазин одежды</title>
  <meta name="description" content="Демонстрационный магазин одежды. Вымышленный бренд, заказы не оплачиваются и не отправляются.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <div id="site-header"></div>
  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Демо-коллекция</p>
      <h1 id="hero-title">Базовая<br>одежда</h1>

      <div class="actions">
        <a class="btn" href="catalog.html">Смотреть каталог</a>
        <a class="btn ghost" href="catalog.html?new=1">Новинки</a>
      </div>
    </section>

    <section class="section" aria-labelledby="cats-title">
      <div class="section-head"><h2 id="cats-title">Категории</h2></div>
      <div class="cats" id="cats"></div>
    </section>

    <section class="section" aria-labelledby="new-title">
      <div class="section-head">
        <h2 id="new-title">Новинки</h2>
        <a class="btn ghost small" href="catalog.html?new=1">Все новинки</a>
      </div>
      <div id="new-grid" class="grid" aria-live="polite"><p class="loading">Загрузка…</p></div>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
